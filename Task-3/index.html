<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>My Expense Tracker</h1>
      <p>Track your money, one transaction at a time.</p>
    </header>

    <section class="summary" aria-label="Financial overview">
      <div class="summary-card">
        <h2>Total Income</h2>
        <p id="total-income">₹0.00</p>
      </div>

      <div class="summary-card">
        <h2>Total Expenses</h2>
        <p id="total-expenses">₹0.00</p>
      </div>

      <div class="summary-card">
        <h2>Current Balance</h2>
        <p id="balance">₹0.00</p>
      </div>
    </section>

    <section class="form-section">
      <h2>Add Transaction</h2>

      <form id="transaction-form">
        <div class="form-group">
          <label for="description">Description</label>
          <input
            type="text"
            id="description"
            placeholder="Example: Lunch or Salary"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input
            type="number"
            id="amount"
            min="0.01"
            step="0.01"
            placeholder="Enter a positive amount"
            required
          >
        </div>

        <div class="form-group">
          <label for="type">Transaction Type</label>
          <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <button type="submit" id="submit-button">
          Add Transaction
        </button>

        <button type="button" id="cancel-edit" hidden>
          Cancel Edit
        </button>
      </form>
    </section>

    <section class="history-section">
      <h2>Transaction History</h2>

      <label for="category-filter">Filter expenses by category</label>
      <select id="category-filter">
        <option value="all">All Transactions</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Health">Health</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>

      <p id="empty-message">No transactions yet.</p>
      <ul id="transaction-list"></ul>
    </section>
  </main>
</body>
</html>
